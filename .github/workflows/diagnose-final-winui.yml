name: Diagnose Final WinUI

on:
  pull_request:
    branches: [ main ]

jobs:
  diagnose:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: WindowsLANMessenger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Capture native build
        shell: pwsh
        continue-on-error: true
        run: dotnet build CydLAN.App/CydLAN.App.csproj --configuration Release -p:Platform=x64 -v:diag *> final-native-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-winui-diagnostics
          path: |
            WindowsLANMessenger/final-native-build.log
            WindowsLANMessenger/CydLAN.App/obj/**/output.json
