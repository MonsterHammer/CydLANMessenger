name: Capture Godot UI V2

on:
  pull_request:
    branches: [ main ]

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y xvfb scrot unzip wget
          wget -q https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v4.6.3-stable_linux.x86_64
          Xvfb :99 -screen 0 1400x900x24 >/tmp/xvfb.log 2>&1 &
          export DISPLAY=:99
          sleep 2
          ./Godot_v4.6.3-stable_linux.x86_64 --path GodotLANMessenger/cyd-lan-messenger --editor --quit-after 8 >/tmp/import.log 2>&1 || true
          ./Godot_v4.6.3-stable_linux.x86_64 --path GodotLANMessenger/cyd-lan-messenger >/tmp/run.log 2>&1 &
          PID=$!
          sleep 10
          scrot /tmp/cydlan-v2.png
          kill $PID || true
          cat /tmp/import.log
          cat /tmp/run.log
      - uses: actions/upload-artifact@v4
        with:
          name: cydlan-v2
          path: /tmp/cydlan-v2.png
