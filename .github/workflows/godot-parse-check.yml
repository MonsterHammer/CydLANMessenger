name: Godot Parse Check

on:
  push:
    branches:
      - debug/godot-47-parse
  pull_request:
    branches:
      - main

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.7
        run: |
          curl -fL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v4.7-stable_linux.x86_64
      - name: Import project and launch main scene
        shell: bash
        run: |
          set +e
          timeout 180 ./Godot_v4.7-stable_linux.x86_64 --headless --editor --path GodotLANMessenger/cyd-lan-messenger --import --verbose 2>&1 | tee godot-import.log
          import_status=${PIPESTATUS[0]}
          timeout 45 ./Godot_v4.7-stable_linux.x86_64 --headless --path GodotLANMessenger/cyd-lan-messenger --quit-after 5 --verbose 2>&1 | tee godot-run.log
          run_status=${PIPESTATUS[0]}
          cat godot-import.log godot-run.log > godot.log
          grep -Ei "SCRIPT ERROR|Parse Error|Parser Error|Failed to load script" godot.log > godot-errors.log || true
          cat godot-errors.log
          if [ "$import_status" -ne 0 ] || [ "$run_status" -ne 0 ] || [ -s godot-errors.log ]; then
            exit 1
          fi
      - name: Upload Godot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-parse-log
          path: |
            godot.log
            godot-import.log
            godot-run.log
            godot-errors.log
