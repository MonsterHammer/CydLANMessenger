name: Godot 4.7 Modernization CI

on:
  push:
    branches:
      - upgrade/godot-4.7-modernization
  pull_request:
    paths:
      - "GodotLANMessenger/cyd-lan-messenger/**"
      - ".github/workflows/godot-modernization-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-modernization:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout modernization branch
        uses: actions/checkout@v4
        with:
          ref: upgrade/godot-4.7-modernization
          fetch-depth: 0

      - name: Apply queued modernization patch
        shell: bash
        run: |
          if [[ ! -f .github/modernization.patch.gz.b64 ]]; then
            echo "No queued patch payload."
            exit 0
          fi
          base64 --decode .github/modernization.patch.gz.b64 | gzip --decompress > /tmp/modernization.patch
          git apply --check -p1 /tmp/modernization.patch
          git apply -p1 /tmp/modernization.patch
          rm .github/modernization.patch.gz.b64
          git config user.name "CydLAN Modernization Bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "feat: modernize CydLAN Messenger for Godot 4.7"
          git push origin HEAD:upgrade/godot-4.7-modernization

  validate-godot-project:
    needs: apply-modernization
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout latest modernization branch
        uses: actions/checkout@v4
        with:
          ref: upgrade/godot-4.7-modernization

      - name: Set up Godot 4.7 stable
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false

      - name: Import and validate project
        working-directory: GodotLANMessenger/cyd-lan-messenger
        run: |
          godot --version
          godot --headless --editor --path . --quit-after 120

      - name: Run legacy protocol compatibility tests
        working-directory: GodotLANMessenger/cyd-lan-messenger
        run: godot --headless --path . --script res://tests/protocol_compatibility_test.gd

      - name: Package validated repository snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyd-lan-messenger-source-${{ github.run_number }}
          path: |
            .
            !.git/**
          include-hidden-files: true
          retention-days: 3
